name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so the whitespace check below can reach the PR base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Bare `git diff --check` compares the working tree to the index, which is
      # always clean on a fresh checkout -- in CI it would pass unconditionally
      # and gate nothing.
      #
      # Diff from the PR's fork point to the PR head, not from the base tip to
      # the merge commit. The merge commit contains everything `main` gained
      # since the branch started, so if `main` ever introduced trailing
      # whitespace this PR would be blamed for it. Anchoring on `merge-base`
      # makes the range exactly the commits this branch added -- verified both
      # ways in a scratch repository: whitespace arriving from `main` passes,
      # whitespace committed on the branch still fails.
      #
      # This step requires the `fetch-depth: 0` on the checkout above. Both SHAs
      # are parents of the `refs/pull/N/merge` ref, so a full-depth fetch reaches
      # them; at depth 1 `git merge-base` exits non-zero with "Not a valid commit
      # name" and the job goes red. That fails closed rather than passing
      # vacuously, but it reads like a git bug, so keep the two together.
      - name: Check for whitespace errors in changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fork_point=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Checking $fork_point..$HEAD_SHA"
          git diff --check "$fork_point" "$HEAD_SHA"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run build
      # ADR 0009 shipped this budget enforced only by the local matrix, and said
      # so in its negative consequences: a contributor who never runs
      # `npm run verify` would not see it fail. That objective could not close
      # the gap because `.github/**` was outside its allowed paths. This is the
      # objective that has them, so the gate now runs where every pull request
      # meets it. It reads the build above, needs no browser, and costs ~40 ms.
      #
      # Two things to know before moving it. It must stay in the same job as
      # the build: it reads `.next`, and it also reads `node_modules/three` for
      # the positive control that catches a renamed marker, so it cannot run
      # against a build artifact alone. And `e2e` has `needs: build`, so a byte
      # regression now also skips both end-to-end checks -- fail-closed for the
      # merge, but you lose the e2e signal on that run.
      #
      # The exit code is not the only signal that is checked. ADR 0009 records
      # this gate once exiting 0 having run nothing at all, because Node
      # realpaths the ESM module specifier but leaves `process.argv[1]` as
      # typed, so its entry guard was false. That is fixed, and an empty step
      # log would still have read as a pass. Asserting the success line closes
      # the class rather than the instance: a run that measures nothing prints
      # nothing and fails here.
      - name: First-load payload budget
        shell: bash
        run: |
          # Both options pinned, not one. Without -e the last command is grep,
          # so a gate that printed the success line and then exited 1 would be
          # overridden by grep's 0 and the step would go green. GitHub supplies
          # -e today; inheriting it silently while pinning pipefail explicitly
          # is the same asymmetry this repository keeps finding.
          set -eo pipefail
          node scripts/check-bundle-budget.mjs | tee "$RUNNER_TEMP/budget.log"
          grep -q 'within budget and three.js is not in it' "$RUNNER_TEMP/budget.log"

  e2e:
    # docs/QUALITY_GATES.md "Phase 1 final gate" requires both Playwright
    # projects. Running only mobile-375 left every desktop-only assertion --
    # the keyboard-traversal and accessible-name gates in particular -- outside
    # the merge gate. The matrix reports each viewport as its own check so a
    # desktop regression is not attributed to mobile.
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `browsers` is per-project. Each job installs only the browser its
        # Playwright project launches: chromium for devices['Desktop Chrome'],
        # webkit for devices['iPhone 13']. Installing webkit alongside chromium
        # made the desktop job download WebKit's entire system dependency set
        # -- libavcodec, libflite, libass, libbluray -- for a browser it never
        # launches, while the other job pulled the same packages concurrently
        # from the same Ubuntu mirror, and timed the job out at 20 minutes
        # before a single test ran.
        #
        # For a while mobile-375 installed chromium too, on the belief that
        # something in chromium's --with-deps package set was load-bearing for
        # the react-globe.gl HTML layer under WebKit: with webkit alone,
        # e2e/globe.spec.ts "honours reduced motion" failed waiting 20 s for a
        # `.iss-marker` that never entered the DOM. That belief was wrong. The
        # failure was a real race in the app -- three-globe's build-in spin
        # versus its memoised behind-the-globe check, see the comment on
        # animateIn in components/Globe/GlobeScene.tsx and the "build-in" test
        # in e2e/globe.spec.ts -- whose window depends on the ISS's latitude at
        # test time, which is why it came and went between runs. The extra
        # packages are not the cause -- the failure reproduces on macOS WebKit
        # with no Ubuntu packages at all -- so the install is trimmed back to
        # webkit alone; the webkit-only run on this PR is the proof that
        # webkit alone suffices.
        include:
          - project: desktop-chromium
            browsers: chromium
          - project: mobile-375
            browsers: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
