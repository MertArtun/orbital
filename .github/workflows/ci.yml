name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the whitespace check below can reach the PR base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Bare `git diff --check` compares the working tree to the index, which is
      # always clean on a fresh checkout -- in CI it would pass unconditionally
      # and gate nothing. Diffing the PR base against the head commit is what
      # actually inspects the lines this PR introduces.
      - name: Check for whitespace errors in changed lines
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.sha }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run build

  e2e:
    # docs/QUALITY_GATES.md "Phase 1 final gate" requires both Playwright
    # projects. Running only mobile-375 left every desktop-only assertion --
    # the keyboard-traversal and accessible-name gates in particular -- outside
    # the merge gate. The matrix reports each viewport as its own check so a
    # desktop regression is not attributed to mobile.
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-375]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
