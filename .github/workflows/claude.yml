name: Claude Code review and implementation

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body || '', '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # checkout v6+ persists its token through an includeIf.gitdir file, which
      # claude-code-action@v1 does not clean up (anthropics/claude-code-action#1721),
      # so the workflow token would stay live for every git command the agent runs.
      # The action configures its own scoped auth; checkout must not persist one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 160"
