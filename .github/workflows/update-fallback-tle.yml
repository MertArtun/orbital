name: Refresh repository ISS TLE

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/update-fallback-tle.mjs
      - name: Open update PR when the fixture changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/fallback-tle.json; then
            echo "Fallback TLE is unchanged."
            exit 0
          fi
          branch="chore/refresh-iss-tle-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/fallback-tle.json
          git commit -m "chore: refresh fallback ISS TLE"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh fallback ISS TLE" \
            --body "Automated weekly refresh from CelesTrak. CI must validate the parsed fixture before merge."
