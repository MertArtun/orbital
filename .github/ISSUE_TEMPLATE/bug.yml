name: Bug report
about: Report a reproducible ORBITAL defect
labels: [quality-gate]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Deny geolocation...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options: [Desktop, Mobile 375px, Other]
  - type: textarea
    id: evidence
    attributes:
      label: Console output, screenshot or failing test
